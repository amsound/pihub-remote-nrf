# Builds the Pi image on GitHub and publishes it to GitHub's container registry:
#   ghcr.io/amsound/pihub-remote-nrf:latest   (every push to main)
#   ghcr.io/amsound/pihub-remote-nrf:sha-abc1234   (that exact commit, for rolling back)
# Builds on a native arm64 runner (free for public repos), so no emulation.

name: image

on:
  push:
    branches: [main]
    paths: ["pihub/**", "Dockerfile", "requirements.txt", ".github/workflows/image.yml"]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
