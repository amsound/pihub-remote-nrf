<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PiHub</title>
<script>try{const t=localStorage.getItem("pihub-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/web/style.css">
<style>
.rooms { display: flex; gap: 6px; flex-wrap: wrap; }
.room { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 10px; background: var(--card); box-shadow: var(--shadow); color: var(--text); text-decoration: none; font-weight: 600; border: 1px solid transparent; }
.room .m { color: var(--muted); font-weight: 500; }
.room.here { border-color: var(--accent); }
.pill.bad { color: var(--bad); }

/* Headline boxes: one value each; a time, where it applies, sits on the label line */
.strip { display: grid; grid-template-columns: 1.3fr 1.5fr repeat(4, 1fr); gap: 12px; }
.strip .card { padding: 12px 16px; }
.label { display: flex; justify-content: space-between; gap: 8px; }
.label .t { text-transform: none; letter-spacing: 0; font-weight: 500; }
.big { font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.big svg { width: 24px; height: 24px; color: var(--accent); flex: none; }
.big small { font-size: 13px; color: var(--muted); font-weight: 500; }

.main { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.dev { display: grid; gap: 10px; align-content: start; }
.dev-head { display: flex; align-items: center; gap: 10px; }
.dev-head svg { width: 20px; height: 20px; color: var(--muted); }
.dev-head h2 { margin: 0; }
.dev-head .tag { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--chip); padding: 2px 8px; border-radius: 6px; font-weight: 600; }
.state { font-size: 20px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
.state .dot { width: 10px; height: 10px; align-self: center; }
.state .since { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--muted); }
.vol { display: flex; align-items: center; gap: 10px; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }

.conn { display: grid; grid-template-columns: 20px 1fr auto; gap: 2px 10px; align-items: center; }
.conn + .conn { border-top: 1px solid var(--hair); padding-top: 10px; }
.conn svg { width: 20px; height: 20px; color: var(--muted); }
.conn .n { font-weight: 600; }
.conn .d { grid-column: 2 / -1; color: var(--muted); font-size: 12px; }

.bottom { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; align-items: start; }
.flow { display: grid; grid-template-columns: 110px 90px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--hair); }
.flow:first-child { border-top: 0; }
.flow .when, .flow .ms { color: var(--muted); font-variant-numeric: tabular-nums; }
.flow .name { font-weight: 600; }

/* Control: the same Off / Listen / Watch selector as the phone remote */
.seg { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--chip); border-radius: 10px; padding: 3px; }
.seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 8px; background: var(--seg-thumb); box-shadow: 0 1px 2px rgba(0,0,0,.12); transition: transform .3s cubic-bezier(.3,.7,.2,1); }
.seg[data-mode="listen"] .seg-thumb { transform: translateX(100%); }
.seg[data-mode="watch"] .seg-thumb { transform: translateX(200%); }
.seg[data-mode=""] .seg-thumb { opacity: 0; }
.seg button { position: relative; z-index: 1; border: 0; background: none; color: var(--text); font: inherit; font-weight: 600; padding: 7px 0; cursor: pointer; }
.seg button.pending { animation: breathe 1s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .35; } }
.more { margin-top: 12px; }
.more summary { cursor: pointer; color: var(--muted); font-weight: 600; list-style: none; }
.more summary::-webkit-details-marker { display: none; }
.more summary::after { content: " ›"; }
.more[open] summary::after { content: " ⌄"; }
.more .rows { display: grid; gap: 8px; margin-top: 10px; }
.more .row { display: flex; align-items: center; gap: 8px; }
.more .row .k { color: var(--muted); width: 76px; flex: none; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
#action-note { margin-top: 10px; min-height: 16px; }

@media (max-width: 1000px) {
  .strip { grid-template-columns: repeat(3, 1fr); }
  .main, .bottom { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>PiHub</h1>
    <span class="pill" id="overall-pill"><span class="dot" id="overall-dot"></span><span id="overall"></span></span>
    <span class="pill bad" id="power-pill" hidden>Undervoltage</span>
    <div class="rooms" id="rooms"></div>
    <nav class="tabs"></nav>
  </div>

  <section class="strip">
    <div class="card"><div class="label">Mode</div><div class="big" id="mode"></div></div>
    <div class="card"><div class="label">Last trigger<span class="t" id="trigger-at"></span></div><div class="big" id="trigger"></div></div>
    <div class="card"><div class="label">CPU</div><div class="big" id="cpu"></div></div>
    <div class="card"><div class="label">Memory</div><div class="big" id="mem"></div></div>
    <div class="card"><div class="label">Pi uptime</div><div class="big" id="up"></div></div>
    <div class="card"><div class="label">PiHub uptime</div><div class="big" id="pup"></div></div>
  </section>

  <section class="main">
    <div class="card dev" id="tv"></div>
    <div class="card dev" id="speaker"></div>
    <div class="card dev">
      <div class="dev-head"><h2>Connections</h2></div>
      <div id="connections"></div>
    </div>
  </section>

  <section class="bottom">
    <div class="card">
      <h2>Recent flows</h2>
      <div id="flows"></div>
    </div>
    <div class="card">
      <h2>Control</h2>
      <div class="seg" id="seg" data-mode="">
        <span class="seg-thumb"></span>
        <button data-flow="power_off">Off</button>
        <button data-flow="listen">Listen</button>
        <button data-flow="watch">Watch</button>
      </div>
      <details class="more">
        <summary>More</summary>
        <div class="rows">
          <div class="row"><span class="k">Set mode</span>
            <button class="btn sm" data-mode="power_off">Off</button><button class="btn sm" data-mode="listen">Listen</button><button class="btn sm" data-mode="watch">Watch</button></div>
          <div class="row"><span class="k">Refresh</span>
            <button class="btn sm" data-post="/refresh/tv">TV</button><button class="btn sm" data-post="/refresh/speaker">Speaker</button></div>
          <div class="row"><span class="k">PiHub</span>
            <button class="btn sm danger" data-post="/admin/restart" data-confirm="Restart PiHub?">Restart</button></div>
        </div>
      </details>
      <div class="note" id="action-note"></div>
      <div class="sub" id="built"></div>
    </div>
  </section>
</div>
<script type="module" src="/web/status.js"></script>
</body>
</html>
