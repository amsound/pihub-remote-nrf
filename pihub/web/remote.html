<!doctype html>
<html lang="en" data-mode="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Remote</title>
<style>
:root {
  --bg: #f2f2f7;
  --surface: #ffffff;
  --surface-press: #e5e5ea;
  --pad: #ffffff;
  --text: #1c1c1e;
  --muted: #8e8e93;
  --hair: rgba(60,60,67,.12);
  --accent: #0a84ff;
  --accent-ink: #ffffff;
  --seg-bg: #e3e3e8;
  --seg-thumb: #ffffff;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-press: #2c2c2e;
    --pad: #1c1c1e;
    --text: #f2f2f7;
    --muted: #8e8e93;
    --hair: rgba(84,84,88,.45);
    --seg-bg: #1c1c1e;
    --seg-thumb: #48484a;
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
.app {
  max-width: 430px;
  /* svh = the visible screen on iOS (100% / 100vh include the hidden toolbar area) */
  min-height: 100vh;
  min-height: 100svh;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 20px);
  display: flex;
  flex-direction: column;
  gap: 22px;
}
header { display: flex; align-items: center; justify-content: center; }
h1 { margin: 0; font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: .01em; }

/* Segmented control: Off / Listen / Watch */
.seg {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--seg-bg);
  border-radius: 14px;
  padding: 4px;
}
.seg-thumb {
  position: absolute; top: 4px; bottom: 4px; left: 4px;
  width: calc((100% - 8px) / 3);
  border-radius: 11px;
  background: var(--seg-thumb);
  box-shadow: 0 1px 3px rgba(0,0,0,.12);
  transition: transform .32s cubic-bezier(.3,.7,.2,1), background .2s;
}
:root[data-mode="off"] .seg-thumb { transform: translateX(0); }
:root[data-mode="listen"] .seg-thumb { transform: translateX(100%); }
:root[data-mode="watch"] .seg-thumb { transform: translateX(200%); }
.seg button {
  position: relative; z-index: 1;
  border: 0; background: none; color: var(--text);
  height: 52px; border-radius: 11px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font: inherit; font-size: 13px; font-weight: 600;
}
.seg button svg { width: 22px; height: 22px; }
.seg button.pending svg { animation: breathe 1s ease-in-out infinite; }
.seg.failed .seg-thumb { background: color-mix(in srgb, #ff3b30 30%, var(--seg-thumb)); }
@keyframes breathe { 50% { opacity: .35; } }

/* Touch pad */
.pad {
  position: relative;
  aspect-ratio: 1 / 1;
  width: 100%;
  max-width: 330px;
  margin: 0 auto;
  border-radius: 34px;
  background: var(--pad);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: opacity .25s, transform .25s;
}
.pad button {
  position: absolute; border: 0; background: none; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: color .12s;
}
.pad button svg { width: 30px; height: 30px; }
.pad .up    { top: 0; left: 25%; width: 50%; height: 25%; }
.pad .down  { bottom: 0; left: 25%; width: 50%; height: 25%; }
.pad .left  { left: 0; top: 25%; width: 25%; height: 50%; }
.pad .right { right: 0; top: 25%; width: 25%; height: 50%; }
.pad .ok {
  top: 50%; left: 50%; width: 36%; height: 36%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: var(--bg);
  color: var(--text);
  font-size: 17px; font-weight: 600;
  transition: transform .12s, background .12s;
}
.pad button.pressed { color: var(--accent); }
.pad .ok.pressed { transform: translate(-50%, -50%) scale(.94); background: var(--surface-press); color: var(--text); }
.pad .ripple {
  position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px;
  border-radius: 50%; background: var(--accent); opacity: .16; pointer-events: none;
  animation: ripple .45s ease-out forwards;
}
@keyframes ripple { from { transform: scale(.3); opacity: .22; } to { transform: scale(1.6); opacity: 0; } }

/* Buttons row */
.row { display: grid; gap: 12px; }
.row.three { grid-template-columns: repeat(3, 1fr); }
.key {
  height: 64px; border: 0; border-radius: 20px;
  background: var(--surface); color: var(--text);
  box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font: inherit; font-size: 15px; font-weight: 600;
  transition: transform .1s, background .1s;
}
.key svg { width: 24px; height: 24px; }
.key.pressed { transform: scale(.95); background: var(--surface-press); }

/* Volume: one pill, minus and plus, mute in the middle */
.volume {
  display: grid; grid-template-columns: 1fr auto 1fr;
  height: 64px; border-radius: 20px; overflow: hidden;
  background: var(--surface); box-shadow: var(--shadow);
}
.volume button {
  border: 0; background: none; color: var(--text);
  display: flex; align-items: center; justify-content: center;
  transition: background .1s;
}
.volume button svg { width: 26px; height: 26px; }
.volume .mute { width: 64px; color: var(--muted); border-left: 1px solid var(--hair); border-right: 1px solid var(--hair); }
.volume .mute.on { color: var(--accent); }
.volume button.pressed { background: var(--surface-press); }

/* Off state */
.off-note {
  flex: 1; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
  color: var(--muted); font-size: 15px; text-align: center; min-height: 300px;
}
.off-note svg { width: 44px; height: 44px; opacity: .5; }
:root[data-mode="off"] .controls { display: none; }
:root[data-mode="off"] .off-note { display: flex; }
:root[data-mode="listen"] .watch-only { display: none; }
:root[data-mode="watch"] .listen-only { display: none; }
.pad .listen-only.ok { font-size: 0; }

.controls { display: flex; flex-direction: column; gap: 14px; margin-top: auto; }

</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="room"></h1>
  </header>

  <nav class="seg" aria-label="Room mode">
    <span class="seg-thumb"></span>
    <button data-flow="power_off" aria-label="Off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
      Off
    </button>
    <button data-flow="listen" aria-label="Listen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      Listen
    </button>
    <button data-flow="watch" aria-label="Watch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg>
      Watch
    </button>
  </nav>

  <div class="off-note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
    The room is off
  </div>

  <section class="controls">
    <div class="pad" id="pad">
      <button class="up watch-only" data-key="rem_dir_up" aria-label="Up">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
      </button>
      <button class="down watch-only" data-key="rem_dir_down" aria-label="Down">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="left" data-key="rem_dir_left" aria-label="Left / previous">
        <svg class="watch-only" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        <svg class="listen-only" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12L18 6v12z"/></svg>
      </button>
      <button class="right" data-key="rem_dir_right" aria-label="Right / next">
        <svg class="watch-only" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        <svg class="listen-only" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
      <button class="ok" data-key="rem_ok" aria-label="Select / play-pause">
        <span class="watch-only">OK</span>
        <svg class="listen-only" viewBox="0 0 24 24" fill="currentColor" style="width:34px;height:34px"><path d="M7 5l10 7-10 7z"/></svg>
      </button>
    </div>

    <div class="row three watch-only">
      <button class="key" data-key="rem_exit" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        Back
      </button>
      <button class="key" data-key="rem_menu" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg>
        Home
      </button>
      <button class="key" data-key="rem_play" aria-label="Play / pause">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5l8 7-8 7zM14 5h2.5v14H14zM18.5 5H21v14h-2.5z"/></svg>
      </button>
    </div>

    <div class="volume">
      <button data-key="rem_vol_down" aria-label="Volume down">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button class="mute" data-key="rem_mute" aria-label="Mute" id="mute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
      <button data-key="rem_vol_up" aria-label="Volume up">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>
      </button>
    </div>
  </section>
</div>

<script type="module" src="/web/remote.js"></script>
</body>
</html>
